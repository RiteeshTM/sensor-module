[project]
name = "sensor-module"
version = "2.1.0"
description = "Kinetic Forensics - physics-based deepfake detection from facial landmark motion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "google-genai>=1.0.0",
    "firebase-admin>=6.5.0",
]

[project.scripts]
sensor = "sensor:main"
